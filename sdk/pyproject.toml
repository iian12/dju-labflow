
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labflow-sdk"
version = "0.1.1"
description = "Python SDK for Labflow experiment tracking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC BY-NC-ND"}
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
examples = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
]
system = [
    "psutil>=6,<9",
    "nvidia-ml-py>=13.580,<14",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "build>=1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["backend: requires an explicitly configured live test backend"]

[tool.setuptools.package-data]
labflow = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
