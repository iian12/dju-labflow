# 테스트 프로필에서만 사용하는 메모리 DB. 운영 MariaDB 설정을 대체하지 않는다.
spring.datasource.url=jdbc:h2:mem:labflow-test;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# 외부 시스템에서 사용하지 않는 테스트 전용 서명 키.
jwt.secret-key=labflow-test-only-secret-key-at-least-32-bytes-long
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d
jwt.cookie.secure=false
jwt.cookie.same-site=Lax
app.cors.allowed-origins=http://localhost:5173
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
auth.email-verification.secret=test-only-email-hmac-secret-at-least-32-bytes
