# 운영에서는 허용 출처를 명시하고 HTTPS 쿠키를 기본으로 사용한다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
# Production DDL is owned by Flyway; a local JPA_DDL_AUTO override must not enable updates.
spring.jpa.hibernate.ddl-auto=validate

# Metrics are collected over SSH through a separate loopback-only management listener.
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=labflow
