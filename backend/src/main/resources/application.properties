spring.application.name=backend

# Gradle/IDE 실행 디렉터리가 backend 또는 저장소 루트인 경우를 모두 지원한다.
# 별도 위치는 OS 환경변수 DOTENV_LOCATION=file:/absolute/path/.env[.properties]로 지정한다.
spring.config.import=${DOTENV_LOCATION:optional:file:./.env[.properties],optional:file:./backend/.env[.properties]}
spring.profiles.default=${APP_PROFILE:local}
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/labflow}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:15m}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:7d}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}

# Swagger UI는 브라우저의 CSRF 쿠키를 읽어 변경 요청 헤더에 자동으로 전달한다.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# 인증 코드용 비밀키는 JWT 키와 분리하고 32바이트 이상으로 지정한다.
auth.email-verification.secret=${EMAIL_VERIFICATION_SECRET:}
auth.email-verification.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
